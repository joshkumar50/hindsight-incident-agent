# ====================================================================
# docker-compose.yml — Hindsight Incident Agent Microservices Orchestration
# ====================================================================
# Runs 2 services:
#   1. backend  — Python FastAPI SRE Agent (port 8000)
#   2. frontend — React + Nginx dashboard (port 3000)
#
# HOW TO RUN:
#   docker-compose up --build
#
# ====================================================================

version: '3.8'

services:
  # ---- Python FastAPI Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airci-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Memory Provider: Hindsight Persistent Memory
      # Requires HINDSIGHT_API_KEY injected in environment
      - HINDSIGHT_CLOUD_BASE=https://api.hindsight.vectorize.io
    networks:
      - airci-network

  # ---- React Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airci-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # This is injected into Nginx config dynamically on startup
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - airci-network

networks:
  airci-network:
    driver: bridge
