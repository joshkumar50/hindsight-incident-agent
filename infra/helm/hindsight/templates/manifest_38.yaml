apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: incident-agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  serviceName: redis-master
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - --appendonly
        - 'yes'
        - --tcp-keepalive
        - '60'
        ports:
        - containerPort: 6379
        # Probes: increased timeoutSeconds + failureThreshold to survive
        # momentary load spikes in Minikube single-node environments.
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - mountPath: /data
          name: redis-data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: incident-agent-system
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
