apiVersion: v1
data:
  SERVICE_NAME: anomaly-engine
kind: ConfigMap
metadata:
  name: anomaly-engine-config
  namespace: incident-agent-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-engine
  namespace: incident-agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-engine
  template:
    metadata:
      labels:
        app: anomaly-engine
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: anomaly-engine-config
        - configMapRef:
            name: hindsight-agent-global-config
        - secretRef:
            name: hindsight-agent-secrets
        image: hindsight-agent/anomaly-engine:latest
        imagePullPolicy: Never
        livenessProbe:
          httpGet:
            path: /liveness
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        name: anomaly-engine
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-engine
  namespace: incident-agent-system
spec:
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: anomaly-engine
