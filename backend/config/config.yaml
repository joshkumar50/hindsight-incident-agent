# ====================================================================
# AI-RCI Platform Configuration - LLM API Connections & Agent Workflow
# ====================================================================

# Default provider to use: 'bedrock', 'openai', or 'anthropic'
default_llm_provider: "bedrock"

# --------------------------------------------------------------------
# AWS Bedrock Connection Keys & Settings
# --------------------------------------------------------------------
bedrock:
  aws_access_key_id: ""          # Leave empty to use default AWS credentials / IAM role
  aws_secret_access_key: ""      # Leave empty to use default AWS credentials / IAM role
  aws_session_token: ""          # Optional temporary session token
  aws_region: "us-east-1"
  model_id: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  agent_id: ""                   # Optional: AWS Bedrock Agent ID
  agent_alias_id: "TSTALIASID"   # Optional: AWS Bedrock Agent Alias ID

# --------------------------------------------------------------------
# OpenAI API Connection Keys & Settings (Alternative / Flexibility)
# --------------------------------------------------------------------
openai:
  api_key: ""                    # OpenAI API Key (e.g. sk-...)
  model_id: "gpt-4o"             # Default OpenAI model for analysis
  api_base: "https://api.openai.com/v1" # Custom API base/proxy (optional)

# --------------------------------------------------------------------
# Anthropic Direct API Connection Keys & Settings (Alternative / Flexibility)
# --------------------------------------------------------------------
anthropic:
  api_key: ""                    # Anthropic API Key (e.g. sk-ant-...)
  model_id: "claude-3-5-sonnet-20241022" # Direct Anthropic model ID

# --------------------------------------------------------------------
# Agent Workflow & Behavior Configurations
# --------------------------------------------------------------------
agent:
  max_iterations: 8              # Safety limit for the ReAct agent tool-calling loop
  temperature: 0.1               # Lower values ensure highly deterministic, factual RCA
  max_tokens: 4096               # Maximum size of response output
  verbose: true                  # Output detailed trace/reasoning logs in local console
  fallback_to_direct_invocation: true # Fallback to single-turn LLM analysis if tools fail

# --------------------------------------------------------------------
# Hindsight Persistent Memory Configuration
# --------------------------------------------------------------------
hindsight:
  api_key: "hsk_b2ede7b743adcebfdaedfe306fc9d28f_0f2a8dd40929075a"

