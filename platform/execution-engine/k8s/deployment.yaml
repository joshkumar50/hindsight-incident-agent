apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-engine-config
  namespace: incident-agent-system
data:
  SERVICE_NAME: "execution-engine"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-engine
  namespace: incident-agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-engine
  template:
    metadata:
      labels:
        app: execution-engine
    spec:
      serviceAccountName: recovery-engine-sa  # Ensures they have K8s API rights if needed
      containers:
      - name: execution-engine
        image: hindsight_agent-execution-engine:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: execution-engine-config
        - configMapRef:
            name: hindsight_agent-global-config
        - secretRef:
            name: hindsight_agent-secrets
        livenessProbe:
          httpGet:
            path: /liveness
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: execution-engine
  namespace: incident-agent-system
spec:
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: execution-engine
