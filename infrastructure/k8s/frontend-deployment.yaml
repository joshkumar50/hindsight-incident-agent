# ====================================================================
# Kubernetes Deployment — AI-RCI Frontend (React + Nginx)
# ====================================================================
# Deploy: kubectl apply -f frontend-deployment.yaml
# ====================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: airci-frontend
  namespace: airci
  labels:
    app: airci-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airci-frontend
  template:
    metadata:
      labels:
        app: airci-frontend
        tier: frontend
    spec:
      containers:
        - name: airci-frontend
          image: <YOUR_ECR_REGISTRY>/airci-frontend:latest
          ports:
            - containerPort: 80
          env:
            # ---- Dynamically load Backend URL from ConfigMap ----
            - name: BACKEND_API_URL
              valueFrom:
                configMapKeyRef:
                  name: airci-configmap
                  key: BACKEND_API_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: airci-frontend-svc
  namespace: airci
spec:
  selector:
    app: airci-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: LoadBalancer
