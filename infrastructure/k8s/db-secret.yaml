# ====================================================================
# Kubernetes Secret — AWS RDS MySQL Credentials
# ====================================================================
# IMPORTANT: Replace the base64 values with your actual RDS credentials
#
# To encode: echo -n "your-value" | base64
# Example:   echo -n "admin" | base64  →  YWRtaW4=
#
# Deploy: kubectl apply -f db-secret.yaml
# ====================================================================

apiVersion: v1
kind: Secret
metadata:
  name: airci-db-secret
  namespace: airci
type: Opaque
data:
  # Base64 encoded values — REPLACE THESE with your actual RDS values
  # echo -n "airci-rds-instance.xxxxxx.us-east-1.rds.amazonaws.com" | base64
  host: YWlyY2ktcmRzLWluc3RhbmNlLnh4eHh4eC51cy1lYXN0LTEucmRzLmFtYXpvbmF3cy5jb20=
  # echo -n "admin" | base64
  username: YWRtaW4=
  # echo -n "your-secure-password" | base64
  password: eW91ci1zZWN1cmUtcGFzc3dvcmQ=

---
# ====================================================================
# Kubernetes Namespace
# ====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: airci
