# ====================================================================
# Kubernetes Secret — PostgreSQL audit-log DB credentials. NOTE: Incident memory/persistence uses Vectorize Hindsight Cloud, not this DB.
# ====================================================================
# IMPORTANT: Replace the base64 values with your actual Hindsight API key
#
# To encode: echo -n "your-value" | base64
# Example:   echo -n "hsk_123" | base64
#
# Deploy: kubectl apply -f db-secret.yaml
# ====================================================================

apiVersion: v1
kind: Secret
metadata:
  name: airci-db-secret
  namespace: airci
type: Opaque
data:
  # Base64 encoded values — REPLACE THESE with your actual values
  # echo -n "hsk_your_api_key_here" | base64
  HINDSIGHT_API_KEY: aHNrX3lvdXJfYXBpX2tleV9oZXJl

---
# ====================================================================
# Kubernetes Namespace
# ====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: airci
