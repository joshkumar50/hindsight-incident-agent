# ====================================================================
# Kubernetes Deployment — AI-RCI Backend (FastAPI SRE Agent)
# ====================================================================
# Deploy: kubectl apply -f backend-deployment.yaml
# ====================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: airci-backend
  namespace: airci
  labels:
    app: airci-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airci-backend
  template:
    metadata:
      labels:
        app: airci-backend
        tier: backend
    spec:
      containers:
        - name: airci-backend
          image: <YOUR_ECR_REGISTRY>/airci-backend:latest
          ports:
            - containerPort: 8000
          env:
            # ---- MySQL RDS Connection ----
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: airci-db-secret
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: airci-configmap
                  key: MYSQL_PORT
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: airci-db-secret
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airci-db-secret
                  key: password
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: airci-configmap
                  key: MYSQL_DATABASE
            # ---- AWS Bedrock ----
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: airci-configmap
                  key: AWS_REGION
            - name: DEFAULT_LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: airci-configmap
                  key: DEFAULT_LLM_PROVIDER
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      # Use IRSA (IAM Roles for Service Accounts) for Bedrock access
      serviceAccountName: airci-backend-sa

---
apiVersion: v1
kind: Service
metadata:
  name: airci-backend-svc
  namespace: airci
spec:
  selector:
    app: airci-backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
